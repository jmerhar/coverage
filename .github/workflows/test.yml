name: Test tooling

# These scripts are the coverage gate and the source of the published numbers for every project on the
# site, so a regression here would mis-report or stop gating all of them at once.
#
# The coverage steps deliberately use the actions from this checkout (./.github/actions/...) rather
# than a released tag: for this repository the tooling *is* the product, so CI has to exercise the
# version under review, not the last one published.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # pytest only to write the JUnit report Codecov's test analytics reads; the suites are unittest.
      - name: Install coverage.py and pytest
        run: python3 -m pip install --disable-pip-version-check --quiet coverage pytest

      # The shell suites are skipped here and run under kcov below, which measures them as it goes.
      - name: Tests (Python, under coverage)
        run: |
          PYTHON_RUNNER="python3 -m coverage run -p" SKIP_SHELL_SUITES=1 JUNIT_DIR=junit \
            bin/test-all.sh

      # json drives the summary, gate and manifest; html is what gets published; xml is for Codecov.
      - name: Assemble the Python coverage report
        run: |
          python3 -m coverage combine
          python3 -m coverage json -o coverage/coverage.json
          python3 -m coverage html -d coverage/htmlcov
          python3 -m coverage xml -o coverage/coverage.xml
          python3 -m coverage report --precision=1

      # kcov has no Ubuntu 24.04 package, so this falls back to the pinned upstream image. It runs the
      # shell suites, so their failures fail the build here.
      - name: Tests (shell, under kcov)
        run: JUNIT_DIR=junit bin/run-shell-coverage.sh

      # shellcheck is preinstalled on GitHub-hosted runners.
      - name: ShellCheck
        # -x so it follows bin/test-lib.sh, which the shell suites source.
        run: shellcheck -x bin/*.sh .github/actions/lib/*.sh

      # publish.yml runs from the `reports` branch, because a push resolves workflows from the branch
      # it targets; the copy here is the original. Nothing enforces that they match, so a change made
      # here and not synced would leave the deploy running old code — silently, since both branches
      # look fine on their own. Read the other copy over the API rather than fetching the branch,
      # whose working tree is the entire report archive.
      - name: The deploy workflow matches the report branch's copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/publish.yml?ref=reports" \
                 --jq .content | base64 -d > /tmp/publish-on-reports.yml; then
            echo "::warning::Could not read publish.yml from the reports branch; skipping the check."
            exit 0
          fi
          if diff -u /tmp/publish-on-reports.yml .github/workflows/publish.yml; then
            echo "publish.yml is in sync with the reports branch."
            exit 0
          fi
          # On a pull request the two cannot yet agree: the branch is synced after merging. Flag it
          # for the reviewer instead of blocking, then fail once it has landed and stayed unsynced.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::warning::publish.yml differs from the reports branch — sync it after merging."
          else
            echo "::error::publish.yml differs from the copy on the reports branch, which is the one"
            echo "::error::that actually deploys. Push this file to the reports branch."
            exit 1
          fi

      - uses: ./.github/actions/summary

      # Informational, never fails the build (see codecov.yml); the gate below is the actual check.
      # Runs before it so coverage still lands when the gate fails. `!cancelled()` so a failing suite
      # still reports its failures, which is the point of test analytics — the files it uploads are
      # derived from coverage.toml, one flag per suite.
      - uses: ./.github/actions/codecov
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          junit: junit/*.xml

      - uses: ./.github/actions/gate

      # Publishes this repository's own coverage to the site it hosts. Skips with a notice until
      # COVERAGE_PAGES_TOKEN exists: a push made with the default GITHUB_TOKEN would not trigger the
      # deploy workflow, so the report would sit on the branch unpublished.
      - uses: ./.github/actions/publish
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          description: Coverage of the shared tooling
