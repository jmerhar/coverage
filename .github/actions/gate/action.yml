name: Coverage gate
description: Fail the build when a suite's line coverage is below the gate in the project's coverage.toml.

# Run this after any coverage upload steps (Codecov and the like) so their data still lands when the
# gate fails, and before publishing so a regression does not reach the coverage site.

inputs:
  config:
    description: Path to the project's coverage.toml, relative to working-directory.
    required: false
    default: coverage.toml
  working-directory:
    description: Directory to run in. Report paths in coverage.toml are resolved from here.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Coverage gate
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        source "$GITHUB_ACTION_PATH/../lib/resolve.sh"
        python3 "$COVERAGE_BIN/coverage-report.py" --config "${{ inputs.config }}" --gate
